name = "8-11-26-brevo-engine"
main = "src/index.js"
compatibility_date = "2026-08-11"

# Preserve variables configured in the Cloudflare dashboard
# when GitHub/Wrangler deploys a new version.
keep_vars = true

[vars]

# Set these in Cloudflare Worker Settings → Variables and Secrets.
# Do NOT put real secret values in this file.

# BREVO_API_KEY = ""
# BREVO_LIST_ID = "123"
# BREVO_SENDER_EMAIL = "earlyaccess@invite.moveapt.com"
# BREVO_SENDER_NAME = "MoveApt Early Access"
# ADMIN_TOKEN = ""

[triggers]

# Every Monday at 14:00 UTC.
crons = ["0 14 * * 1"]

[assets]
directory = "./public"
binding = "ASSETS"
